name: Go SQLite SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.x', 'stable']
    env:
      GOPRIVATE: github.com/tianacloud/sdk-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - name: Download private SDK dependencies
        env:
          SDK_READ_TOKEN: ${{ secrets.SDK_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
        run: |
          if [ -z "$SDK_READ_TOKEN" ]; then
            echo "::error::SDK_READ_TOKEN must grant read access to tianacloud/sdk-go."
            exit 1
          fi
          export GIT_ASKPASS
          GIT_ASKPASS="$(mktemp "$RUNNER_TEMP/tiana-sdk-askpass.XXXXXX")"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SDK_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$GIT_ASKPASS"
          go mod download
      - run: go test -mod=readonly -race -timeout 2m ./...
      - run: go vet -mod=readonly ./...
      - run: python3 scripts/check-public-source.py
